<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Check your consultation booking status."><title>Booking status | ADITYA CONSULTANTS</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html"><b>ADITYA</b><small>CONSULTANTS</small></a></header><main class="section legal"><p class="eyebrow">BOOKING STATUS</p><h1 id="title">Checking your payment…</h1><p id="message" class="lead">Please keep this page open while we verify the Razorpay payment.</p><p id="details"></p><p><a href="mailto:adityamalik@atomicmail.io">Need help? Email Aditya Malik</a></p></main><footer><a class="brand light" href="index.html"><b>ADITYA</b><small>CONSULTANTS</small></a><a href="consultation.html">Consultation details</a></footer><script>
const params=new URLSearchParams(location.search),id=params.get('booking_id'),title=document.getElementById('title'),message=document.getElementById('message'),details=document.getElementById('details');
function niceSlot(data){const [hour,minute]=data.time.split(':').map(Number),[year,month,day]=data.date.split('-').map(Number),instant=new Date(Date.UTC(year,month-1,day,hour,minute)-330*60000);if(data.market==='United Kingdom')return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'short'}).format(instant)+' (UK local time)';return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(instant)+' at '+data.time+' IST'}
async function check(){if(!id){title.textContent='Booking reference missing';message.textContent='Please contact us if you completed payment.';return}for(let i=0;i<7;i++){try{const r=await fetch('/api/booking-status?booking_id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(d.status==='confirmed'){title.textContent='Your consultation is booked';message.textContent='Payment is verified. We look forward to speaking with you.';details.textContent=niceSlot(d)+' (approximately 45 minutes).';return}if(d.status==='payment_received_needs_attention'){title.textContent='Payment received — confirmation needed';message.textContent='Your payment was received, but we could not automatically secure the selected time. Please email us with your booking reference so we can arrange the session.';details.textContent='Booking reference: '+id;return}if(d.status==='payment_expired'||d.status==='not_found'){title.textContent='This booking hold has expired';message.textContent='No appointment was confirmed. Please choose a new time and try again.';return}}catch{}await new Promise(resolve=>setTimeout(resolve,2500))}title.textContent='Payment verification is taking longer';message.textContent='Please do not pay again. Refresh this page in a few minutes or contact us with your booking reference.';details.textContent='Booking reference: '+id}
check();
</script><script src="site.js" defer></script></body></html>
