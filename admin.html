<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Booking List | ADITYA CONSULTANTS</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html"><b>ADITYA</b><small>CONSULTANTS</small></a></header><main class="section legal"><p class="eyebrow">PRIVATE ADMIN</p><h1>Bookings</h1><p>Enter the admin token configured in Vercel. This page does not save it beyond this browser tab.</p><form id="admin-form"><label for="token">Admin token</label><input id="token" type="password" autocomplete="off" required><button class="button">Load bookings</button></form><p id="admin-status" role="status"></p><div id="booking-list"></div></main><script>
document.getElementById('admin-form').addEventListener('submit',async e=>{e.preventDefault();const token=document.getElementById('token').value,status=document.getElementById('admin-status'),root=document.getElementById('booking-list');status.textContent='Loading…';root.replaceChildren();try{const r=await fetch('/api/admin-bookings',{headers:{authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load bookings');status.textContent=d.bookings.length+' booking record(s).';d.bookings.forEach(b=>{const card=document.createElement('article');card.className='booking-record';const h=document.createElement('h2');h.textContent=b.date+' '+b.time+' IST — '+b.status;const p=document.createElement('p');p.textContent=b.name+' · '+b.email+' · '+b.market+' · '+b.price_label+(b.phone?' · '+b.phone:'')+(b.business?' · '+b.business:'');card.append(h,p);root.append(card)})}catch(err){status.textContent=err.message||'Could not load bookings.'}});
</script><script src="site.js" defer></script></body></html>
